<h2>Registrati</h2>

<form (ngSubmit)="register()">
    <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="Email"
            required
    />
    <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            required
    />

    <button type="submit">Crea account</button>

    <p *ngIf="error" style="color:red">{{ error }}</p>
    <p *ngIf="success" style="color:green">{{ success }}</p>
</form>

<p>
    Hai già un account?
    <a routerLink="/auth/login">Accedi</a>
</p>
