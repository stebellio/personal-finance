<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <div class="sidebar__brand">
    <div class="sidebar__logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 7.5C3 5.567 4.567 4 6.5 4h11C19.433 4 21 5.567 21 7.5v9c0 1.933-1.567 3.5-3.5 3.5h-11C4.567 20 3 18.433 3 16.5v-9Z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3 9h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="17" cy="14.5" r="1.2" fill="currentColor"/>
      </svg>
    </div>
    <div class="sidebar__brand-text">
      <span class="sidebar__brand-title">Personal</span>
      <span class="sidebar__brand-subtitle">Finance</span>
    </div>
    <button
      type="button"
      class="sidebar__toggle"
      (click)="toggle()"
      [attr.aria-label]="collapsed ? 'Espandi sidebar' : 'Comprimi sidebar'"
    >
      <svg *ngIf="!collapsed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="collapsed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="Navigazione principale">
    <ng-container *ngFor="let group of groups">
      <p class="sidebar__nav-section" *ngIf="group.label && !collapsed">{{ group.label }}</p>
      <div class="sidebar__nav-divider" *ngIf="group.label && collapsed"></div>
      <a
        *ngFor="let item of group.items"
        class="sidebar__nav-item"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [title]="collapsed ? item.label : ''"
      >
        <span class="sidebar__nav-icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <rect x="14" y="3" width="7" height="5" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <rect x="14" y="12" width="7" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <rect x="3" y="16" width="7" height="5" rx="2" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <svg *ngSwitchCase="'wallet'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 7.5C3 5.567 4.567 4 6.5 4H17a4 4 0 0 1 4 4v9a3 3 0 0 1-3 3H6.5A3.5 3.5 0 0 1 3 16.5v-9Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M21 11h-4a2 2 0 1 0 0 4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg *ngSwitchCase="'closures'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 9h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M8 14l2.5 2.5L16 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngSwitchCase="'target'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
          <svg *ngSwitchCase="'building'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 21h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M5 21V7l7-4 7 4v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="9" y="13" width="6" height="8" rx="1" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="sidebar__nav-label">{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>

  <div class="sidebar__footer">
    <div class="sidebar__user" [title]="collapsed ? userEmail : ''">
      <div class="sidebar__avatar">{{ userInitial }}</div>
      <div class="sidebar__user-info">
        <span class="sidebar__user-label">Connesso come</span>
        <span class="sidebar__user-email" [title]="userEmail">{{ userEmail }}</span>
      </div>
    </div>
    <button type="button" class="sidebar__logout" (click)="logout()" [title]="collapsed ? 'Logout' : ''">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 12H4m0 0 3.5-3.5M4 12l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 4h7a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>Logout</span>
    </button>
  </div>
</aside>
